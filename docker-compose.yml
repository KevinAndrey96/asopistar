version: '3.8'

services:
  asopistar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asopistar-app
    restart: unless-stopped
    ports:
      - "8094:80"
    environment:
      APP_NAME: "Asopistar Aquaculture ERP"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "="
      APP_URL: "http://localhost:8094"
      DB_CONNECTION: mysql
      DB_HOST: asopistar-db
      DB_PORT: 3306
      DB_DATABASE: asopistar_db
      DB_USERNAME: asopistar_user
      DB_PASSWORD: ***REMOVED***
      MAIL_MAILER: smtp
      MAIL_HOST: asopistar-mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: "no-reply@asopistar.local"
      MAIL_FROM_NAME: "Asopistar Aquaculture Portal"
    depends_on:
      asopistar-db:
        condition: service_healthy
    networks:
      - asopistar-network

  asopistar-db:
    image: mariadb:10.11
    container_name: asopistar-db
    restart: unless-stopped
    ports:
      - "3312:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_DATABASE: asopistar_db
      MYSQL_USER: asopistar_user
      MYSQL_PASSWORD: ***REMOVED***
    volumes:
      - asopistar_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asopistar-network

  asopistar-pma:
    image: phpmyadmin:latest
    container_name: asopistar-pma
    restart: unless-stopped
    ports:
      - "8095:80"
    environment:
      PMA_HOST: asopistar-db
      PMA_USER: root
      PMA_PASSWORD: ***REMOVED***
    depends_on:
      - asopistar-db
    networks:
      - asopistar-network

  asopistar-mailpit:
    image: axllent/mailpit:latest
    container_name: asopistar-mailpit
    restart: unless-stopped
    ports:
      - "8026:8025" # Web UI
      - "1025:1025" # SMTP Port
    networks:
      - asopistar-network

networks:
  asopistar-network:
    driver: bridge

volumes:
  asopistar_mariadb_data:
