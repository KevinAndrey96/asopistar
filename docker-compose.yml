name: asopistar

services:
  app:
    build:
      context: .
      target: runtime
    image: asopistar-erp:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?run make env first}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_DATABASE: asopistar
      DB_USERNAME: asopistar
      DB_PASSWORD: ${DB_PASSWORD:?run make env first}
      LOG_CHANNEL: stderr
      SESSION_ENCRYPT: "true"
      FILESYSTEM_DISK: public
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: asopistar
      MARIADB_USER: asopistar
      MARIADB_PASSWORD: ${DB_PASSWORD:?run make env first}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mariadb:
  uploads:
